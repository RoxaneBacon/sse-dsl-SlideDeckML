<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Code Instructor">
    <meta name="title" content="Code Workshop">
    <title>Code Workshop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/dist/theme/white.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/plugin/highlight/monokai.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/editor/editor.main.css">
    <style>

        

        /* Synchronized fragments styling */
        .sync-container {
            position: relative;
            min-height: 50px;
            font-size: 0.9em;
        }
        .sync-item {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .sync-item.active {
            display: block;
            opacity: 1;
        }
        .sync-item p {
            margin: 0.3em 0;
        }
        .sync-item img {
            max-width: 100%;
            height: auto;
        }
        /* Keep mode: stack items vertically */
        .sync-container[data-keep="true"] {
            display: flex;
            flex-direction: column;
            gap: 0.3em;
        }
        .sync-container[data-keep="true"] .sync-item {
            position: relative;
        }

        /* IDE Editor and Output styling */
        .ide-editor-container, .ide-output-container {
            display: inline-block;
            vertical-align: top;
            margin: 0.5em;
            position: relative;
        }
        /* Remove margin when inside absolutely positioned parent */
        [style*="position: absolute"] > .ide-editor-container,
        [style*="position: absolute"] > .ide-output-container {
            margin: 0;
        }
        .monaco-editor-wrapper {
            border-radius: 4px;
            overflow: hidden;
        }
        .run-button {
            position: absolute;
            top: -40px;
            left: 0;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            padding: 8px 16px;
            cursor: pointer;
            z-index: 10;
        }
        .run-button:hover {
            background: #005a9e;
        }
        .output-header {
            border-radius: 4px 4px 0 0;
        }
        .output-content {
            border-radius: 4px;
            border: 1px solid #3c3c3c;
            overflow-y: auto;
            overflow-x: auto;
            max-height: 350px;
        }
        .output-content:empty::before {
            content: 'Output';
            color: #6c6c6c;
            font-style: italic;
        }
        /* Center IDE elements when not absolutely positioned */
        section:not([style*="position: absolute"]) .ide-editor-container,
        section:not([style*="position: absolute"]) .ide-output-container {
            text-align: left;
        }
    </style>
</head>
<body>
    
    <div class="reveal">
        <div class="slides">
        <section data-slide-index="0">
            <h1>Welcome to the Code Workshop</h1>
            <p>Today we&#39;ll explore Python, Sql and Javascript</p>
        </section>
        <section data-slide-index="1">
            <div style="position: absolute; z-index: 1; left: 0px; top: 50px">
            <div class="ide-editor-container">
                <button class="run-button" data-editor-id="editor-0">▶ Run</button>
                <div id="editor-0"
                     class="monaco-editor-wrapper"
                     data-language="python"
                     data-output-id="python-output"
                     data-initial-code="def fibonacci(n):&#10;    if n &lt;= 1:&#10;        return n&#10;    return fibonacci(n-1) + fibonacci(n-2)&#10;&#10;print(fibonacci(5))    &#10;"
                     style="width: 500px; height: 350px; border: 1px solid #ccc;"></div>
            </div>
            </div>
            <div style="position: absolute; z-index: 1; left: 0px; top: 420px">
            <div class="ide-output-container">
                <div id="python-output" class="output-content" style="width: 500px; box-sizing: border-box; background: #1e1e1e; color: #d4d4d4; padding: 12px; margin: 0; min-height: 100px; max-height: 350px; overflow-y: auto; overflow-x: auto; font-family: 'Courier New', monospace; font-size: 14px; line-height: 1.4; white-space: pre-wrap;"></div>
            </div>
            </div>
            <div style="position: absolute; z-index: 1; left: 570px; top: 100px">
            <h3>Python editor with output at bottom for small exemples</h3>
            </div>
        </section>
        <section data-slide-index="2">
            <h3>Side to side for better graphical view (run please)</h3>
            <div style="position: absolute; z-index: 1; left: -50px; top: 200px">
            <div class="ide-editor-container">
                <button class="run-button" data-editor-id="editor-1">▶ Run</button>
                <div id="editor-1"
                     class="monaco-editor-wrapper"
                     data-language="python"
                     data-output-id="python-output-2"
                     data-initial-code="#!/usr/bin/env python3&#10;import matplotlib.pyplot as plt&#10;import numpy as np&#10;&#10;x = np.linspace(0, 10, 100)&#10;y = np.sin(x)&#10;&#10;plt.plot(x, y, &#39;b-&#39;, linewidth=2)&#10;plt.title(&#39;Simple Sinus&#39;)&#10;plt.xlabel(&#39;x&#39;)&#10;plt.ylabel(&#39;sin(x)&#39;)&#10;plt.grid(True, alpha=0.3)&#10;plt.show()&#10;"
                     style="width: 500px; height: 350px; border: 1px solid #ccc;"></div>
            </div>
            </div>
            <div style="position: absolute; z-index: 1; left: 500px; top: 200px">
            <div class="ide-output-container">
                <div id="python-output-2" class="output-content" style="width: 500px; box-sizing: border-box; background: #1e1e1e; color: #d4d4d4; padding: 12px; margin: 0; min-height: 100px; max-height: 350px; overflow-y: auto; overflow-x: auto; font-family: 'Courier New', monospace; font-size: 14px; line-height: 1.4; white-space: pre-wrap;"></div>
            </div>
            </div>
        </section>
        <section data-slide-index="3">
            <h3>Handle Javascript and SQL too !</h3>
            <div style="position: absolute; z-index: 1; left: -50px; top: 130px">
            <div class="ide-editor-container">
                <button class="run-button" data-editor-id="editor-2">▶ Run</button>
                <div id="editor-2"
                     class="monaco-editor-wrapper"
                     data-language="javascript"
                     data-output-id="javascript-output"
                     data-initial-code="#!/usr/bin/env node&#10;&#10;function fibonacci(n) {&#10;  if (n &lt;= 1) return n;&#10;  return fibonacci(n - 1) + fibonacci(n - 2);&#10;}&#10;&#10;for (let i = 0; i &lt; 5; i++) {&#10;  console.log(`F(${i}) = ${fibonacci(i)}`);&#10;}&#10;"
                     style="width: 500px; height: 350px; border: 1px solid #ccc;"></div>
            </div>
            </div>
            <div style="position: absolute; z-index: 1; left: -50px; top: 500px">
            <div class="ide-output-container">
                <div id="javascript-output" class="output-content" style="width: 500px; box-sizing: border-box; background: #1e1e1e; color: #d4d4d4; padding: 12px; margin: 0; min-height: 100px; max-height: 350px; overflow-y: auto; overflow-x: auto; font-family: 'Courier New', monospace; font-size: 14px; line-height: 1.4; white-space: pre-wrap;"></div>
            </div>
            </div>
            <div style="position: absolute; z-index: 1; left: 500px; top: 130px">
            <div class="ide-editor-container">
                <button class="run-button" data-editor-id="editor-3">▶ Run</button>
                <div id="editor-3"
                     class="monaco-editor-wrapper"
                     data-language="sql"
                     data-output-id="sql-output"
                     data-initial-code="CREATE TABLE users (id INT PRIMARY KEY, name VARCHAR(50));&#10;INSERT INTO users (id, name) VALUES (1, &#39;Alice&#39;);&#10;SELECT * FROM users;&#10;"
                     style="width: 500px; height: 350px; border: 1px solid #ccc;"></div>
            </div>
            </div>
            <div style="position: absolute; z-index: 1; left: 500px; top: 500px">
            <div class="ide-output-container">
                <div id="sql-output" class="output-content" style="width: 500px; box-sizing: border-box; background: #1e1e1e; color: #d4d4d4; padding: 12px; margin: 0; min-height: 100px; max-height: 350px; overflow-y: auto; overflow-x: auto; font-family: 'Courier New', monospace; font-size: 14px; line-height: 1.4; white-space: pre-wrap;"></div>
            </div>
            </div>
        </section>
        <section data-slide-index="4">
            <h1>Thank You!</h1>
            <p>Your feedback helps us improve our workshops</p>
        </section>
        </div>
    </div>

    <!-- Load Reveal.js and plugins first (before Monaco's AMD loader) -->
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/plugin/highlight/highlight.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>

    <!-- SQL.js for SQL execution -->
    <script src="https://cdn.jsdelivr.net/npm/sql.js@1.8.0/dist/sql-wasm.js"></script>

    <!-- Monaco Editor (load after other libraries to avoid AMD conflicts) -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script>
        require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' }});

        // Store all Monaco editors
        window.monacoEditors = {};

        // Initialize all Monaco editors after load
        require(['vs/editor/editor.main'], function() {
            document.querySelectorAll('.monaco-editor-wrapper').forEach(editorElement => {
                const editorId = editorElement.id;
                const language = editorElement.getAttribute('data-language') || 'python';
                const initialCode = editorElement.getAttribute('data-initial-code') || '# Write your ' + language + ' code here\n';

                // Unescape HTML entities from the attribute
                const textarea = document.createElement('textarea');
                textarea.innerHTML = initialCode;
                const unescapedCode = textarea.value;

                window.monacoEditors[editorId] = monaco.editor.create(editorElement, {
                    value: unescapedCode,
                    language: language,
                    theme: 'vs-dark',
                    minimap: { enabled: false },
                    fontSize: 14,
                    lineNumbers: 'on',
                    automaticLayout: true
                });
            });

            // Attach click handlers to run buttons
            document.querySelectorAll('.run-button').forEach(button => {
                button.addEventListener('click', async function() {
                    const editorId = this.getAttribute('data-editor-id');
                    const editor = window.monacoEditors[editorId];

                    if (!editor) {
                        console.error('Editor not found:', editorId);
                        return;
                    }

                    const code = editor.getValue();
                    const editorElement = document.getElementById(editorId);
                    const language = editorElement.getAttribute('data-language');
                    const outputId = editorElement.getAttribute('data-output-id');
                    const outputElement = document.getElementById(outputId);

                    if (!outputElement) {
                        console.error('Output element not found:', outputId);
                        return;
                    }

                    // Execute code based on language
                    if (language === 'python') {
                        await runPythonCode(code, outputElement);
                    } else if (language === 'javascript') {
                        runJavaScriptCode(code, outputElement);
                    } else if (language === 'sql') {
                        await runSQLCode(code, outputElement);
                    }
                });
            });
        });

        // Python execution with Pyodide and matplotlib support
        async function runPythonCode(code, outputElement) {
            try {
                if (!window.pyodideReady) {
                    outputElement.textContent = 'Loading Pyodide...\n';

                    if (!window.pyodideLoading) {
                        window.pyodideLoading = loadPyodide({
                            indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/'
                        }).then(async pyodide => {
                            // Load common packages
                            await pyodide.loadPackage(['numpy', 'matplotlib']);
                            window.pyodide = pyodide;
                            window.pyodideReady = true;
                            return pyodide;
                        });
                    }

                    await window.pyodideLoading;
                }

                const pyodide = window.pyodide;

                // Setup matplotlib and capture output
                pyodide.runPython(`
import sys
from io import StringIO, BytesIO
import matplotlib
import matplotlib.pyplot as plt
import base64

# Use Agg backend for matplotlib (non-interactive)
matplotlib.use('Agg')

# Redirect stdout
sys.stdout = StringIO()

# Clear any previous figures
plt.close('all')
                `);

                await pyodide.runPythonAsync(code);

                // Get text output
                const textOutput = pyodide.runPython('sys.stdout.getvalue()');

                // Get matplotlib figures as base64 images
                const figures = pyodide.runPython(`
import matplotlib.pyplot as plt
figures_data = []
for i in plt.get_fignums():
    fig = plt.figure(i)
    buf = BytesIO()
    fig.savefig(buf, format='png', bbox_inches='tight', dpi=100)
    buf.seek(0)
    img_base64 = base64.b64encode(buf.read()).decode('utf-8')
    figures_data.append(img_base64)
    buf.close()
figures_data
                `);

                // Clear output and display results
                outputElement.innerHTML = '';
                outputElement.style.color = '#d4d4d4';

                // Display text output if any
                if (textOutput) {
                    const textNode = document.createTextNode(textOutput);
                    outputElement.appendChild(textNode);
                }

                // Display matplotlib figures inside the output element (at its absolute position)
                if (figures && figures.length > 0) {
                    figures.forEach(imgData => {
                        const img = document.createElement('img');
                        img.src = 'data:image/png;base64,' + imgData;
                        img.style.maxWidth = '100%';
                        img.style.height = 'auto';
                        img.style.display = 'block';
                        img.style.margin = '10px 0';
                        outputElement.appendChild(img);
                    });
                } else if (!textOutput) {
                    outputElement.textContent = '(No output)';
                }

            } catch (error) {
                outputElement.textContent = 'Error: ' + error.message;
                outputElement.style.color = '#ff6b6b';
            }
        }

        // JavaScript execution
        function runJavaScriptCode(code, outputElement) {
            try {
                const logs = [];
                const originalLog = console.log;
                console.log = (...args) => {
                    logs.push(args.map(a => String(a)).join(' '));
                    originalLog.apply(console, args);
                };

                const result = eval(code);
                console.log = originalLog;

                let output = logs.join('\n');
                if (result !== undefined && logs.length === 0) {
                    output = String(result);
                }
                outputElement.textContent = output || '(No output)';
                outputElement.style.color = '#d4d4d4';

            } catch (error) {
                outputElement.textContent = 'Error: ' + error.message;
                outputElement.style.color = '#ff6b6b';
            }
        }

        // SQL execution with sql.js
        async function runSQLCode(code, outputElement) {
            try {
                if (!window.sqlReady) {
                    outputElement.textContent = 'Loading SQL.js...\n';

                    if (!window.sqlLoading) {
                        window.sqlLoading = initSqlJs({
                            locateFile: file => `https://cdn.jsdelivr.net/npm/sql.js@1.8.0/dist/${file}`
                        }).then(SQL => {
                            window.SQL = SQL;
                            window.sqlReady = true;
                            return SQL;
                        });
                    }

                    await window.sqlLoading;
                }

                const SQL = window.SQL;

                // Create a new database (in-memory)
                const db = new SQL.Database();

                // Split the code into individual statements
                const statements = code.trim().split(';').filter(stmt => stmt.trim());

                outputElement.innerHTML = '';
                outputElement.style.color = '#d4d4d4';

                let hasResults = false;

                // Execute each statement
                for (let i = 0; i < statements.length; i++) {
                    const stmt = statements[i].trim();
                    if (!stmt) continue;

                    try {
                        const results = db.exec(stmt);

                        // If this is a SELECT query, display results
                        if (results.length > 0) {
                            hasResults = true;
                            results.forEach(result => {
                                const table = formatSQLResults(result);
                                outputElement.appendChild(table);
                            });
                        } else if (stmt.toUpperCase().startsWith('SELECT')) {
                            // SELECT returned no rows
                            hasResults = true;
                            const emptyMsg = document.createElement('div');
                            emptyMsg.textContent = 'Query returned 0 rows';
                            emptyMsg.style.marginBottom = '10px';
                            outputElement.appendChild(emptyMsg);
                        } else {
                            // For INSERT, UPDATE, DELETE, CREATE, etc.
                            hasResults = true;
                            const successMsg = document.createElement('div');
                            successMsg.textContent = 'Query executed successfully';
                            successMsg.style.marginBottom = '10px';
                            successMsg.style.color = '#4CAF50';
                            outputElement.appendChild(successMsg);
                        }
                    } catch (stmtError) {
                        hasResults = true;
                        const errorMsg = document.createElement('div');
                        errorMsg.textContent = 'Error: ' + stmtError.message;
                        errorMsg.style.color = '#ff6b6b';
                        errorMsg.style.marginBottom = '10px';
                        outputElement.appendChild(errorMsg);
                    }
                }

                if (!hasResults) {
                    outputElement.textContent = '(No output)';
                }

                // Close the database
                db.close();

            } catch (error) {
                outputElement.textContent = 'Error: ' + error.message;
                outputElement.style.color = '#ff6b6b';
            }
        }

        // Format SQL results as HTML table
        function formatSQLResults(result) {
            const table = document.createElement('table');
            table.style.borderCollapse = 'collapse';
            table.style.marginBottom = '10px';
            table.style.width = '100%';
            table.style.fontSize = '0.9em';

            // Create header
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            result.columns.forEach(col => {
                const th = document.createElement('th');
                th.textContent = col;
                th.style.border = '1px solid #555';
                th.style.padding = '8px';
                th.style.backgroundColor = '#2d2d2d';
                th.style.textAlign = 'left';
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            // Create body
            const tbody = document.createElement('tbody');
            result.values.forEach(row => {
                const tr = document.createElement('tr');
                row.forEach(cell => {
                    const td = document.createElement('td');
                    td.textContent = cell !== null ? cell : 'NULL';
                    td.style.border = '1px solid #555';
                    td.style.padding = '8px';
                    if (cell === null) {
                        td.style.fontStyle = 'italic';
                        td.style.color = '#888';
                    }
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);

            return table;
        }
        </script>

    <script>
        Reveal.initialize({
            hash: true,
            transition: 'slide',
            backgroundTransition: 'fade',
            plugins: [ RevealHighlight ]
        });

        // Auto-render LaTeX when slides are ready
        Reveal.on('ready', function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError: false
            });
        });

        // Synchronized fragments handler
        let currentFragmentIndex = -1;

        Reveal.on('fragmentshown', event => {
            currentFragmentIndex++;
            updateSyncItems();
        });

        Reveal.on('fragmenthidden', event => {
            currentFragmentIndex--;
            updateSyncItems();
        });

        Reveal.on('slidechanged', event => {
            // Detect the current fragment state by checking visible fragments
            const currentSlide = Reveal.getCurrentSlide();
            if (currentSlide) {
                const fragments = currentSlide.querySelectorAll('.fragment');
                let maxVisibleIndex = -1;
                
                fragments.forEach(fragment => {
                    if (fragment.classList.contains('visible')) {
                        const fragmentIndex = parseInt(fragment.getAttribute('data-fragment-index') || '0');
                        maxVisibleIndex = Math.max(maxVisibleIndex, fragmentIndex);
                    }
                });
                
                currentFragmentIndex = maxVisibleIndex;
            } else {
                currentFragmentIndex = -1;
            }
            updateSyncItems();
        });

        function updateSyncItems() {
            const currentSlide = Reveal.getCurrentSlide();
            if (!currentSlide) return;

            const syncContainers = currentSlide.querySelectorAll('.sync-container');
            syncContainers.forEach(container => {
                const keepMode = container.getAttribute('data-keep') === 'true';
                const items = container.querySelectorAll('.sync-item');
                
                items.forEach(item => {
                    const syncIndex = parseInt(item.getAttribute('data-sync-index') || '0');
                    
                    if (keepMode) {
                        // In keep mode, show all items up to and including current index
                        if (syncIndex <= currentFragmentIndex) {
                            item.classList.add('active');
                        } else {
                            item.classList.remove('active');
                        }
                    } else {
                        // Default mode: show only the current item
                        if (syncIndex === currentFragmentIndex) {
                            item.classList.add('active');
                        } else {
                            item.classList.remove('active');
                        }
                    }
                });
            });
        }

        // Initialize on load
        Reveal.on('ready', () => {
            updateSyncItems();
        });
    </script>
</body>
</html>
